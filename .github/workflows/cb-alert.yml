name: Convertible Bond Alert

on:
  schedule:
    # 工作日 8:30 (北京时间 UTC+8 = 0:30 UTC)
    # GitHub Actions cron 使用 UTC 时间
    - cron: '30 0 * * 1-5'
  # 支持手动触发，方便调试
  workflow_dispatch:

jobs:
  cb-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt --quiet

      - name: 运行可转债申购提醒
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python cb_alert.py
