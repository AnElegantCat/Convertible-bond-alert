name: Convertible Bond Alert

on:
  schedule:
    # 工作日 6:00 北京时间 (UTC+8 = 前一天 22:00 UTC)
    # 提前运行，避免 GitHub Actions 调度延迟导致中午才推送
    - cron: '0 22 * * 0-4'
  # 支持手动触发，方便调试
  workflow_dispatch:

jobs:
  cb-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade akshare --quiet
          pip install -r requirements.txt --quiet

      - name: 运行可转债申购提醒
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python cb_alert.py
